# .github/workflows/docs.yml
name: docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "src/zwingen/**"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/zwingen/**"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
  workflow_dispatch:

concurrency:
  group: docs-$ github.ref
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build:
    name: build mkdocs site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync (with docs extras)
        run: uv sync --all-extras --dev

      - name: Build site (strict)
        run: uv run mkdocs build --strict --site-dir site/

      - name: Run link check
        run: uv run python -m linkchecker site/ --check-extern --no-warnings || true

      - name: Validate theorem-card schema
        run: uv run python scripts/regenerate_theorem_cards.py --check

      - name: Upload site artefact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  preview:
    name: pr preview comment
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: $ secrets.CLOUDFLARE_API_TOKEN
          accountId: $ secrets.CLOUDFLARE_ACCOUNT_ID
          projectName: zwingen-docs-preview
          directory: site
          gitHubToken: $ secrets.GITHUB_TOKEN

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            **Docs preview** for this PR is live at:
            $ steps.deploy.outputs.url

            Built from commit $ github.event.pull_request.head.sha .

  deploy-latest:
    name: deploy latest to docs.zwingen.dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: docs-latest
      url: https://docs.zwingen.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: $ secrets.CLOUDFLARE_API_TOKEN
          accountId: $ secrets.CLOUDFLARE_ACCOUNT_ID
          projectName: zwingen-docs
          branch: main
          directory: site
          gitHubToken: $ secrets.GITHUB_TOKEN

  trigger-readthedocs:
    name: trigger versioned build on Read the Docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: POST webhook
        env:
          RTD_TOKEN: $ secrets.READTHEDOCS_TOKEN
        run: |
          curl -X POST \
            -H "Authorization: Token ${RTD_TOKEN}" \
            "https://readthedocs.org/api/v3/projects/zwingen/versions/latest/builds/"
