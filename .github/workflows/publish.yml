# .github/workflows/publish.yml
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish (must already exist)"
        required: true

permissions:
  contents: read
  id-token: write   # Required for sigstore + Trusted Publisher OIDC
  attestations: write

concurrency:
  group: publish-$ github.ref
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build the source distribution once on Linux
  # ---------------------------------------------------------------------------
  sdist:
    name: build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: uv run python -m build --sdist --outdir dist/

      - name: Twine check
        run: uv run python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build wheels with cibuildwheel for the stable interpreter matrix
  # ---------------------------------------------------------------------------
  wheels-stable:
    name: "wheels (stable, $ matrix.os )"
    runs-on: $ matrix.os
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_i686 pp*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_TEST: "pip install pytest hypothesis"
          CIBW_TEST_COMMAND: "pytest --pyargs zwingen -q -k 'not slow and not gpu'"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-$ matrix.os
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build free-threaded wheels (advisory: do not block the release)
  # ---------------------------------------------------------------------------
  wheels-free-threaded:
    name: "wheels (free-threaded, advisory)"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build free-threaded wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp313t-* cp314t-* cp315t-*"
          CIBW_FREE_THREADED_SUPPORT: "1"
          CIBW_ARCHS_LINUX: "x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-free-threaded
          path: wheelhouse/*.whl
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Sign every artefact with sigstore using OIDC identity
  # ---------------------------------------------------------------------------
  sign:
    name: sigstore sign
    needs: [sdist, wheels-stable, wheels-free-threaded]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artefacts
        run: ls -la dist/

      - name: Sign with sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist/*
          release-signing-artifacts: true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-signed
          path: |
            dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish to TestPyPI first (smoke test)
  # ---------------------------------------------------------------------------
  testpypi:
    name: publish to TestPyPI
    needs: [sign]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/zwingen
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-signed
          path: dist

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          attestations: true

      - name: Smoke install from TestPyPI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "zwingen==${GITHUB_REF_NAME#v}"
          /tmp/smoke/bin/python -c "import zwingen as zw; print(zw.__version__); zw.runtime_info()"

  # ---------------------------------------------------------------------------
  # Promote to PyPI via Trusted Publisher (no API tokens)
  # ---------------------------------------------------------------------------
  pypi:
    name: publish to PyPI
    needs: [testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zwingen
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-signed
          path: dist

      - name: Upload to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          verbose: true

  # ---------------------------------------------------------------------------
  # Open a PR on conda-forge feedstock to bump the version
  # ---------------------------------------------------------------------------
  conda-forge:
    name: bump conda-forge feedstock
    needs: [pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger feedstock bump
        env:
          CF_TOKEN: $ secrets.CONDA_FORGE_TOKEN
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.github.com/repos/conda-forge/zwingen-feedstock/dispatches" \
            -d '{"event_type": "version-bump", "client_payload": {"version": "'"${GITHUB_REF_NAME#v}"'"}}'
