# License: Apache-2.0
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
    post_install:
      - python -m pip install --upgrade pip uv
      - uv pip install --system -e .[docs]

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
  - pdf

submodules:
  include: all
  recursive: true

search:
  ranking:
    "reference/*": 5
    "how-to/*": 4
    "explanation/*": 3
    "tutorials/*": 4
    "changelog.md": -1
