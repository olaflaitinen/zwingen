# pyproject.toml
# Maintainer: @olaflaitinen <olaf.laitinen@gmail.com>
# License: Apache-2.0

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "zwingen"
dynamic = ["version"]
description = "Compositional, reproducible numerical primitives for empirical research."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Olaf Laitinen", email = "olaf.laitinen@gmail.com" },
]
maintainers = [
    { name = "Olaf Laitinen", email = "olaf.laitinen@gmail.com" },
]
keywords = [
    "numerical",
    "reproducibility",
    "econometrics",
    "jax",
    "optax",
    "numpyro",
    "bayesian",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "optax>=0.2.2",
    "numpyro>=0.15",
    "typing-extensions>=4.10",
]

[project.urls]
Homepage = "https://zwingen.dev"
Documentation = "https://docs.zwingen.dev"
Repository = "https://github.com/olaflaitinen/zwingen"
Changelog = "https://github.com/olaflaitinen/zwingen/blob/main/CHANGELOG.md"
Issues = "https://github.com/olaflaitinen/zwingen/issues"
Discussions = "https://github.com/olaflaitinen/zwingen/discussions"
ReleaseNotes = "https://github.com/olaflaitinen/zwingen/releases"
Funding = "https://github.com/sponsors/olaflaitinen"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyright>=1.1.370",
    "crosshair-tool>=0.0.61",
    "nox>=2024.4.15",
    "build>=1.2",
    "twine>=5.1",
]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.108",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "griffe>=0.45",
]
bench = [
    "asv>=0.6.3",
    "airspeed-velocity>=0.6",
]
release = [
    "sigstore>=3.0",
    "in-toto>=2.2",
]

[project.scripts]
zwingen = "zwingen.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "stubs/",
    "tests/",
    "tools/",
    "docs/",
    "benchmarks/",
    "examples/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    ".zenodo.json",
]
exclude = [
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zwingen"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *-win32 pp*"
test-extras = ["test"]
test-command = "pytest -q {project}/tests/smoke"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools", "benchmarks"]
extend-exclude = ["docs/_build", "build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PL",
    "PT", "RUF", "D", "S", "NPY", "PERF", "FURB",
]
ignore = [
    "D203", "D213",
    "PLR0913",
    "S101",
]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "S"]
"benchmarks/**" = ["D"]
"tools/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "stubs"
files = ["src/zwingen", "tools"]
plugins = []

[[tool.mypy.overrides]]
module = ["jax.*", "jaxlib.*", "optax.*", "numpyro.*"]
ignore_missing_imports = false

[tool.pyright]
include = ["src", "tools"]
exclude = ["**/__pycache__", "build", "dist", ".venv"]
stubPath = "stubs"
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingTypeStubs = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportPrivateUsage = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=zwingen",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:jax.*",
]
markers = [
    "slow: tests that take longer than 1s",
    "gpu: tests that require a CUDA device",
    "reproducibility: tests that compare receipts",
]

[tool.coverage.run]
branch = true
source = ["zwingen"]
parallel = true

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["src/zwingen", "*/site-packages/zwingen"]

[tool.uv]
dev-dependencies = [
    "zwingen[dev,test,docs,bench,release]",
]
