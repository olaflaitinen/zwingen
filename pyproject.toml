[project]
name = "zwingen"
version = "0.1.0"
description = "A mathematically rigorous Python library for advanced machine learning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
	{ name = "Gustav Olaf Yunus Laitinen-Fredriksson Lundström-Imanov", email = "gustav.laitinenfredriksson@gmail.com" },
]
maintainers = [
	{ name = "Gustav Olaf Yunus Laitinen-Fredriksson Lundström-Imanov" },
]
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: Apache Software License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Programming Language :: Python :: Free Threading :: 2 - Beta",
	"Topic :: Scientific/Engineering :: Mathematics",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
	"numpy>=1.26",
	"scipy>=1.12",
	"jax>=0.4.30",
	"jaxlib>=0.4.30",
	"optax>=0.2.0",
	"numpyro>=0.15",
	"networkx>=3.2",
	"pydantic>=2.7",
	"typing-extensions>=4.10",
]

[project.optional-dependencies]
torch = ["torch>=2.3"]
sklearn = ["scikit-learn>=1.5"]
serve = ["fastapi>=0.111", "uvicorn>=0.30", "onnx>=1.16"]
formal = ["crosshair-tool>=0.0.60"]
provenance = ["sigstore>=3.0", "in-toto>=2.2"]
sustainability = ["codecarbon>=2.5"]
experimental = [
	"numpy>=2.1",
	"cffi>=1.17",
]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5", "asv>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.zwingen.python-support]
stable = ["3.10", "3.11", "3.12", "3.13"]
experimental = ["3.14", "3.15"]
free_threaded = ["3.13t", "3.14t", "3.15t"]
notes = "3.14 and 3.15 paths live behind `zwingen.experimental`; ABI and performance contracts are relaxed and CI gates are advisory rather than blocking on these interpreters."

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
